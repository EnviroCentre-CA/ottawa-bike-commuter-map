<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social card render</title>
<link rel="stylesheet" href="../vendor/maplibre-gl.css">
<style>
  /* Authored at the size a reader actually sees the card — roughly 600 px wide
     in a Slack or Teams unfurl. tools/export-og-card.mjs renders this viewport
     at deviceScaleFactor 2, so the PNG comes out at 1200x630 and every size
     below doubles. Writing the CSS at perceived scale rather than at output
     scale also hands MapLibre the right label density for free: collision
     detection runs in CSS pixels, so it thins the labels down to what a 600 px
     map can hold instead of packing in the ~40 a 1200 px map would fit. */
  html, body { margin: 0; background: #f5f3ef; }
  #card {
    position: relative;
    display: flex;
    width: 600px; height: 315px;
    overflow: hidden;
    font: 400 12px/1.4 Mulish, Arial, sans-serif;
  }

  /* Chrome lifted from the site header (index.html), so the card and the page
     it links to read as one product. */
  #panel {
    /* border-box, so the flex basis below is the panel's real width — with the
       default content-box the horizontal padding widened it by 36 px and stole
       that from the map. */
    box-sizing: border-box;
    flex: 0 0 224px;
    display: flex; flex-direction: column;
    padding: 18px 17px;
    background: #14294d;
    border-right: 2px solid #0b1b35;
    color: #fff;
  }
  #panel .logo { height: 30px; width: auto; align-self: flex-start; }
  #panel .titles { margin-top: 26px; }
  #panel h1 {
    margin: 0;
    font-size: 25px; font-weight: 700; line-height: 1.08;
    letter-spacing: -0.015em;
  }
  #panel .sub {
    display: block;
    margin-top: 2px;
    font-size: 16px; font-weight: 600; line-height: 1.2;
    color: rgba(255,255,255,.78);
  }
  /* French keeps the same weights one step down in size, the City's convention
     for a bilingual header where one language leads. */
  /* The French title wraps to two lines at this size, which the column now has
     room for. Sizing it to fit on one line instead would mean 14px — smaller
     than the English subtitle above it, which reads as an afterthought. */
  #panel .fr { margin-top: 15px; }
  #panel .fr h1 { font-size: 17px; }
  #panel .fr .sub { font-size: 12.5px; }
  #panel hr {
    /* Fixed basis: as a flex item the rule would otherwise be the first thing
       shrunk away if the column ever runs long. */
    flex: 0 0 auto;
    width: 44px; height: 3px;
    margin: 24px 0 0;
    border: 0; background: #3f8f88;
  }
  #panel .stats {
    margin-top: 15px;
    font-size: 17px; font-weight: 700;
    letter-spacing: 0.01em;
  }
  #map { flex: 1; position: relative; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-bottom-right { display: none !important; }
  /* MapLibre's own attribution control is hidden, so the tile and OSM credits
     are reproduced here instead — the card is a published map image and has to
     carry them, the same way the poster reproduces them in its footer. */
  #attrib {
    position: absolute; right: 0; bottom: 0; z-index: 2;
    padding: 2px 5px;
    background: rgba(255,255,255,.82);
    font-size: 6.5px; line-height: 1.3; color: #4a4a4a;
  }

  @font-face{font-family:'Mulish';font-style:normal;font-weight:400;src:url('../fonts/mulish-400-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Mulish';font-style:normal;font-weight:400;src:url('../fonts/mulish-400-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:'Mulish';font-style:normal;font-weight:600;src:url('../fonts/mulish-600-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Mulish';font-style:normal;font-weight:600;src:url('../fonts/mulish-600-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:'Mulish';font-style:normal;font-weight:700;src:url('../fonts/mulish-700-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Mulish';font-style:normal;font-weight:700;src:url('../fonts/mulish-700-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
</style>
</head>
<body>
<div id="card">
  <div id="panel">
    <img class="logo" src="../assets/ottawa-logo-white.svg" alt="">
    <!-- Every string here is copied from the I18N table in index.html rather
         than written fresh, so the card cannot say something the page does not. -->
    <div class="titles">
      <h1>Bike Commute Routes</h1>
      <span class="sub">to downtown Ottawa</span>
      <div class="fr">
        <h1>Trajets domicile-travail à vélo</h1>
        <span class="sub">vers le centre-ville d’Ottawa</span>
      </div>
    </div>
    <hr>
    <div class="stats" id="stats"></div>
  </div>
  <div id="map">
    <div id="attrib">© Thunderforest · © OpenStreetMap contributors</div>
  </div>
</div>

<script src="../vendor/maplibre-gl.js"></script>
<script>
const params = new URLSearchParams(location.search);
// Line weights, in CSS px at the authoring scale above. Bolder than the live
// map's 4.5 / 8: the card shows the whole region in 390 px, and in a small
// unfurl the fan of ten corridors is the only thing a reader can make out, so
// it has to carry the image on its own.
const W = Number(params.get('line') || 4);
const CASING_W = Number(params.get('casing') || 7);
const PAD = Number(params.get('pad') || 18);

/**
 * Basemap layers dropped for the card.
 *
 * Two groups. Terrain and points of interest are detail nobody can read at
 * this size, and each one competes with the routes for attention. The
 * basemap's *own* cycling layers are worse than useless here: they draw their
 * own coloured lines along the same corridors, so at card size they read as
 * extra commuter routes. The live map keeps them — there they are context you
 * can zoom into — but a static card has no zoom.
 *
 * station-dot and station-label go for the reason index.html drops them: the
 * tiles mix the operating O-Train with construction sites and VIA Rail.
 */
const HIDDEN = new Set([
  'hillshade', 'contour-line', 'contour-line-major', 'contour-label',
  'mtb-route', 'mtb-route-casing',
  'cycling-route', 'cycling-route-casing',
  'cycling-route-lowzoom', 'cycling-route-lowzoom-casing',
  'oasis-cycleway', 'oasis-cycleway-casing', 'oasis-path',
  'road-cycleway-overlay', 'path-generic',
  'poi-water-dot', 'poi-water-name', 'poi-camping-dot', 'poi-camping-name',
  'poi-rest-dot', 'poi-rest-name', 'poi-bike-dot', 'poi-bike-name',
  'label-cycleway', 'label-cycling-node', 'label-ferry', 'label-waterway',
  'label-protected-area', 'label-island', 'label-neighbourhood',
  'station-dot', 'station-label',
]);

// --- Per-route casing colour ------------------------------------------------
// Copied from index.html, deliberately: the card is a separate render target
// with no access to the page's inline script. The maths matters — the route
// palette runs from near-black navy to near-white yellow, so one fixed white
// casing leaves Nepean and Greenboro invisible. Keep in step with index.html
// if the palette changes there.
const CASING_DARK = '#071546';
const CASING_LIGHT = '#ffffff';
const MAP_EARTH = [245, 243, 239]; // style background #f5f3ef

function parseHex(hex) {
  const h = hex.replace('#', '');
  return [
    parseInt(h.slice(0, 2), 16),
    parseInt(h.slice(2, 4), 16),
    parseInt(h.slice(4, 6), 16),
    // Route colours may carry an alpha suffix, e.g. #fff200eb.
    h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1,
  ];
}
const over = (fg, bg) => [0, 1, 2].map(i => fg[i] * fg[3] + bg[i] * (1 - fg[3]));
function luminance(rgb) {
  const [r, g, b] = rgb.map(c => {
    c /= 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrast(a, b) {
  const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}
function casingFor(color) {
  const line = parseHex(color);
  return [CASING_LIGHT, CASING_DARK]
    .map(c => {
      const casing = over(parseHex(c), MAP_EARTH);
      return { c, ratio: contrast(over(line, casing), casing) };
    })
    .sort((a, b) => b.ratio - a.ratio)[0].c;
}

const map = new maplibregl.Map({
  container: 'map',
  center: [-75.72, 45.38],
  zoom: 9.5,
  attributionControl: false,
  fadeDuration: 0,          // no half-faded labels when we snapshot
  preserveDrawingBuffer: true,
  interactive: false,
});

(async function () {
  const style = await (await fetch('../style-default.json')).json();
  style.layers = style.layers.filter(l => !HIDDEN.has(l.id));

  const routes = await (await fetch('../routes.geojson')).json();
  for (const f of routes.features) f.properties.casing = casingFor(f.properties.color);

  // One entry per route, for the stats line.
  const byId = new Map();
  for (const f of routes.features) {
    if (!byId.has(f.properties.id)) byId.set(f.properties.id, f.properties);
  }
  const totalKm = [...byId.values()].reduce((s, p) => s + p.distance_km, 0);
  document.getElementById('stats').textContent =
    `${byId.size} routes · ${Math.round(totalKm)} km`;

  map.setStyle(style);
  await new Promise(r => map.once('style.load', r));

  map.addSource('commuter', { type: 'geojson', data: routes });
  // Routes go *below* the label layers, so place names stay readable on top of
  // them. The live map draws routes last — there you can pan a label out from
  // under a line — but on a static card an overprinted "Barrhaven" or "Alta
  // Vista" stays unreadable, and those names are what tell a reader which
  // corridor is which.
  const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  // No dimming and no per-section widths: with nothing selected the live map
  // draws every corridor at full strength too, and that even fan is the whole
  // point of the image.
  map.addLayer({
    id: 'commuter-casing', type: 'line', source: 'commuter',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': ['get', 'casing'], 'line-width': CASING_W, 'line-opacity': 0.85 },
  }, firstSymbol);
  map.addLayer({
    id: 'commuter-line', type: 'line', source: 'commuter',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': ['get', 'color'], 'line-width': W, 'line-opacity': 0.95 },
  }, firstSymbol);

  const b = new maplibregl.LngLatBounds();
  routes.features.forEach(f => f.geometry.coordinates.forEach(c => b.extend(c)));
  // The route bbox is wider than it is tall relative to the map area, so the
  // fit is width-constrained and the leftover height becomes basemap above and
  // below the fan. Biasing the padding north pushes the fan down into that
  // slack, which trades farmland south of Findlay Creek — and the stray
  // village names in it — for more of the Ottawa River.
  map.fitBounds(b, {
    padding: { top: PAD + 8, bottom: PAD, left: PAD, right: PAD },
    duration: 0,
  });

  await document.fonts.ready;
  map.once('idle', () => { window.__READY = true; });
})();
</script>
</body>
</html>

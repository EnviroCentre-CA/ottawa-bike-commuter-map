<title>Bike Commute Routes To Downtown Ottawa</title>
<meta name="description" content="Safe bike commute routes to downtown Ottawa. A Cycling Safety Awareness Program resource.">
<!-- City of Ottawa logo mark, cut from assets/ottawa-logo-white.svg. The SVG
     covers current browsers; the PNG is the fallback for older ones, and iOS
     uses the touch icon (which is padded on white, since iOS has no
     transparency on home-screen tiles). -->
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  /* Mulish — the City of Ottawa's brand typeface, self-hosted so the page
     makes no third-party requests. */
  @font-face{font-family:'Mulish';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/mulish-400-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Mulish';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/mulish-400-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:'Mulish';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/mulish-600-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Mulish';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/mulish-600-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:'Mulish';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/mulish-700-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Mulish';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/mulish-700-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}

  /* City of Ottawa palette (from ottawa.ca / ottux theme):
     navy #071546 links & headings · primary blue #004990 · info teal #006170
     body #212529 · muted #6c757d · borders #dee2e6 · light bg #f8f9fa */
  :root {
    --paper: #f8f9fa;
    --ink: #212529;
    --navy: #071546;
    --brand: #004990;
    --brand-teal: #006170;
    /* Application chrome taken from GeoOttawa, so this reads as a City mapping
       product: deep navy bars, white type, square-cornered controls, teal
       active state. */
    --chrome: #14294d;
    --chrome-line: #0b1b35;
    --accent: #3f8f88;
    --muted: #6c757d;
    --card: #ffffff;
    --border: #dee2e6;
    /* legacy names kept so existing rules keep working */
    --teal: #004990;
    --teal-bright: #004990;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 15px/1.5 Mulish, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 9px 14px;
    background: var(--chrome);
    color: #fff;
    border-bottom: 2px solid var(--chrome-line);
  }
  header .logo { height: 36px; width: auto; flex: 0 0 auto; }
  header .titles { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
  header h1 { font-size: 17.5px; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
  header .tagline { font-size: 12.5px; color: rgba(255,255,255,.8); }
  header .toggles { display: flex; gap: 8px; }
  header button {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 5px 13px;
    /* Square corners: City mapping chrome uses boxes, not pills. */
    border: 1px solid rgba(255,255,255,.75); border-radius: 3px;
    background: transparent; color: #fff;
    cursor: pointer;
  }
  header button:hover { background: rgba(255,255,255,.14); }
  header button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  /* Off-screen until focused, then parks over the header. No transition: it
     would be motion for its own sake on a control only keyboard users see. */
  .skip-link {
    position: absolute; z-index: 20;
    left: 8px; top: -100px;
    padding: 9px 15px;
    background: var(--card); color: var(--brand);
    font-weight: 700; font-size: 13px; text-decoration: none;
    border: 2px solid var(--brand); border-radius: 3px;
  }
  .skip-link:focus { top: 8px; }
  /* Focused programmatically by the skip link, so it needs no ring of its own. */
  #route-list:focus { outline: none; }
  /* Everything outside the header fell back to the browser's default ring, which
     is thin and low-contrast on the white panel. 3px with an offset so keyboard
     focus cannot be mistaken for the 2px brand outline .route.active already
     uses to mark the selected route. */
  .route:focus-visible, #showall:focus-visible, #panel-toggle:focus-visible,
  .photo-bubble:focus-visible,
  .maplibregl-popup-content .how-times-cue:focus-visible {
    outline: 3px solid var(--brand); outline-offset: 2px;
  }
  /* Controls that sit on the navy chrome need a light ring instead. */
  #how-times .dlg-close:focus-visible, footer .how-times-cue:focus-visible {
    outline: 2px solid #fff; outline-offset: 2px;
  }
  header button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #wrap { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; }

  #panel {
    position: absolute;
    top: 12px; left: 12px;
    z-index: 5;
    width: 300px;
    max-height: calc(100% - 24px);
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    padding: 12px 14px;
  }
  #panel h2 { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .route {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 7px 8px;
    border: 0; border-radius: 8px;
    background: none;
    font: inherit; text-align: left;
    cursor: pointer;
  }
  .route:hover { background: var(--paper); }
  .route.active { background: var(--paper); outline: 2px solid var(--brand); }
  /* Ring for the same reason the map lines get a casing: the paler route
     colours (yellow, light blue) all but vanish against the white panel. */
  .route .chip {
    flex: 0 0 22px; height: 6px; border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(7,21,70,.4);
  }
  .route .meta { font-size: 12px; color: var(--muted); }
  /* Detail for the selected route. Indented past the chip so it reads as
     belonging to the route above it rather than as a new list entry. */
  .route-detail {
    padding: 1px 8px 9px 40px;
    font-size: 12.5px; line-height: 1.5; color: var(--muted);
  }
  .route-detail .route-desc { color: var(--ink); }
  .route-detail .route-facts { margin: 6px 0 0; padding-left: 15px; }
  .route-detail .route-facts li { margin-top: 3px; }
  .route-detail .how-times-cue {
    margin-top: 8px; font-size: 11.5px; font-weight: 600; color: var(--brand);
  }
  #showall {
    margin-top: 8px; width: 100%;
    font: inherit; font-size: 13px;
    padding: 6px;
    border: 1px dashed var(--border); border-radius: 8px;
    background: none; color: var(--muted); cursor: pointer;
    display: none;
  }
  #showall:hover { border-color: var(--brand); color: var(--brand); }
  #showall.visible { display: block; }
  #safety-note, #oneway-note { display: none; font-size: 12px; color: var(--muted); margin-top: 8px; }
  #safety-note.visible, #oneway-note.visible { display: block; }
  .legend { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
  .legend div { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); padding: 3px 0; }
  .legend .swatch { flex: 0 0 22px; height: 0; }
  /* Swatches take the hues actually drawn on the map (the base map's cycling
     network is teal), not the site's brand palette — but at full strength.
     The network stays dimmed to MUTE_OPACITY on the map, where it is context
     behind the commuter routes; a legend entry is a key symbol rather than a
     screened sample of one, and has to clear 3:1 by itself (WCAG 1.4.11).
     At the previous opacity .55 the on-street lane swatch managed 2.05:1. */
  .swatch.oasis { border-top: 3px solid #006458; }
  .swatch.shared { border-top: 3px dashed #006458; }
  .swatch.lane { border-top: 3px solid #3a8878; }
  /* Stands in for the map's chevron; height 0 on .swatch would hide the glyph. */
  .swatch.arrow {
    height: auto; text-align: center; line-height: 1;
    font-size: 19px; font-weight: 700; color: var(--chrome);
  }
  footer {
    padding: 8px 16px;
    font-size: 10.5px; color: rgba(255,255,255,.85);
    background: var(--chrome);
    border-top: 2px solid var(--chrome-line);
  }
  footer strong { color: #fff; }
  footer a { color: #fff; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  /* "How ride times are estimated" — a button, because it opens a dialog rather
     than going anywhere, but styled as a link so it reads like the credits. */
  .how-times-cue {
    font: inherit; padding: 0;
    border: 0; background: none;
    text-decoration: underline; text-underline-offset: 2px;
    cursor: pointer;
  }
  footer .how-times-cue { color: #fff; font-weight: 600; }
  /* In the map popup it sits under the stats, so it takes the accent colour. */
  .maplibregl-popup-content .how-times-cue {
    display: inline-block; margin-top: 7px;
    font-size: 11.5px; font-weight: 600; color: var(--brand);
  }
  #how-times {
    max-width: 470px; width: calc(100% - 32px);
    /* The `* { margin: 0 }` reset above wipes out <dialog>'s default
       `margin: auto`, which is what centres a modal — put it back. */
    margin: auto;
    /* Cap the height so the text scrolls instead of running off a short screen
       (a phone held sideways). dvh accounts for mobile browser chrome; the vh
       line above it is the fallback. */
    max-height: calc(100vh - 32px);
    max-height: calc(100dvh - 32px);
    padding: 0; border: 1px solid var(--chrome-line); border-radius: 10px;
    background: var(--card); color: var(--ink);
    box-shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  /* Scoped to [open]: setting display on the dialog itself would beat the
     browser's `display: none` and leave the modal permanently on screen. */
  #how-times[open] { display: flex; flex-direction: column; }
  #how-times::backdrop { background: rgba(7,21,70,.45); }
  #how-times a { color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }
  #how-times .dlg-head {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    flex: 0 0 auto;
    padding: 10px 14px;
    background: var(--chrome); color: #fff;
  }
  #how-times h2 { font-size: 15px; font-weight: 700; color: #fff; }
  #how-times .dlg-close {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 4px 11px;
    border: 1px solid rgba(255,255,255,.75); border-radius: 3px;
    background: transparent; color: #fff;
    cursor: pointer; flex: 0 0 auto;
  }
  #how-times .dlg-close:hover { background: rgba(255,255,255,.14); }
  #how-times .dlg-body { padding: 14px; font-size: 13.5px; line-height: 1.55; overflow-y: auto; }
  #how-times .dlg-body p + p { margin-top: 11px; }
  /* MapLibre popups and attribution ship their own font stack — align with the site */
  .maplibregl-popup-content, .maplibregl-ctrl-attrib {
    font-family: Mulish, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .maplibregl-popup-content { color: var(--ink); }
  /* Route facts as a list rather than a run-on line joined by separators.
     padding-left is set explicitly because the browser default (40px) is far too
     deep for a 270px popup; the `* { margin: 0 }` reset handles the rest. */
  .maplibregl-popup-content .pop-stats {
    margin-top: 7px;
    padding-left: 15px;
    font-size: 12px; color: var(--muted);
  }
  .maplibregl-popup-content .pop-stats li { padding: 1.5px 0; }
  .maplibregl-popup-content .pop-desc { margin-top: 2px; }
  /* Photo bubbles — round thumbnails pinned along a selected route */
  .photo-bubble {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 1px 6px rgba(0,0,0,.35);
    background-size: cover;
    background-position: center;
    cursor: pointer;
    padding: 0;
  }
  .photo-bubble:hover { border-color: var(--teal-bright); }
  /* Time-remaining markers along a selected route. White so they stay readable
     over any route colour, with the route's own colour as the border. */
  .time-pill {
    padding: 2px 7px;
    border-radius: 11px;
    border: 2px solid var(--chrome);
    background: #fff;
    font: 700 11.5px/1.35 Mulish, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--chrome);
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
    pointer-events: none; /* never block a click meant for the route line */
  }
  .photo-popup-img { display: block; width: 100%; border-radius: 6px; }
  .photo-popup-caption { font-size: 12px; color: #555; margin-top: 6px; }
  #panel-toggle { display: none; }

  @media (max-width: 700px) {
    header h1 { font-size: 16px; }
    header .tagline { display: none; }
    #panel { width: min(300px, calc(100% - 24px)); display: none; }
    /* Once open, the toggle floats at bottom:24px over the panel — it covered
       the last two routes, and a focused route button could sit behind it.
       End the panel above the button instead so they never overlap. */
    #panel.open { display: block; max-height: calc(100% - 92px); }
    #panel-toggle {
      display: block;
      position: absolute; top: 12px; left: 12px; z-index: 6;
      font: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 14px;
      border: 1px solid var(--border); border-radius: 20px;
      background: var(--card); color: var(--teal);
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      cursor: pointer;
    }
    #panel.open ~ #panel-toggle { top: auto; bottom: 24px; left: 50%; transform: translateX(-50%); }
  }
</style>
</head>
<body>
<!-- The map canvas and its four controls sit ahead of the route list in tab
     order, so reaching the list unaided took nine presses. -->
<a class="skip-link" href="#route-list" data-i18n="skipToRoutes"></a>
<header>
  <img class="logo" src="assets/ottawa-logo-white.svg" alt="City of Ottawa / Ville d’Ottawa">
  <div class="titles">
    <h1 data-i18n="title"></h1>
    <span class="tagline" data-i18n="tagline"></span>
  </div>
  <div class="toggles">
    <button id="lang-toggle"></button>
    <button id="hc-toggle" aria-pressed="false" data-i18n="highContrast"></button>
  </div>
</header>

<main id="wrap">
  <div id="map"></div>
  <div id="panel">
    <h2 data-i18n="routesHeading"></h2>
    <!-- tabindex allows the skip link to land here; the next Tab reaches the
         first route button, which carries its own focus ring. -->
    <div id="route-list" tabindex="-1"></div>
    <button id="showall" data-i18n="showAll"></button>
    <p id="safety-note" data-i18n-html="safetyNote"></p>
    <p id="oneway-note" data-i18n-html="onewayNote"></p>
    <div class="legend">
      <h2 data-i18n="legendHeading"></h2>
      <div><span class="swatch oasis"></span><span data-i18n="legendOasis"></span></div>
      <div><span class="swatch shared"></span><span data-i18n="legendShared"></span></div>
      <div><span class="swatch lane"></span><span data-i18n="legendLane"></span></div>
      <div><span class="swatch arrow">›</span><span data-i18n="legendOneway"></span></div>
    </div>
  </div>
  <button id="panel-toggle" data-i18n="routesHeading" aria-controls="panel" aria-expanded="false"></button>
</main>

<footer>
  <span data-i18n-html="credits"></span> ·
  <button type="button" class="how-times-cue" data-how-times data-i18n="howTimesLink"></button>
</footer>

<dialog id="how-times" aria-labelledby="how-times-title">
  <div class="dlg-head">
    <h2 id="how-times-title" data-i18n="howTimesTitle"></h2>
    <button type="button" class="dlg-close" data-i18n="close"></button>
  </div>
  <div class="dlg-body" data-i18n-html="howTimesBody"></div>
</dialog>

<script src="vendor/maplibre-gl.js"></script>

    dirTowork: 'À suivre à l’aller au travail (vers le centre-ville)',
    dirHome: 'À suivre au retour à la maison (depuis le centre-ville)',
    homeDistance: 'Le retour fait',
    stopNote: 'Comprend environ {m} min d’arrêt aux feux de circulation.',
    pillAria: '{t} avant le centre-ville',
    close: 'Fermer',
    howTimesLink: 'Comment les durées sont estimées',
    howTimesTitle: 'Comment les durées de trajet sont estimées',
    howTimesBody:
      '<p>Chaque trajet est mesuré à partir des données d’OpenStreetMap, et la durée ' +
      'estimée est calculée en deux parties :</p>' +
      '<p>D’abord, le <strong>temps de déplacement</strong> : une vitesse de 18 km/h est ' +
      'appliquée sur tout le parcours. Cette vitesse correspond à un rythme de vélo ' +
      'confortable et accessible. C’est la vitesse moyenne utilisée par ' +
      '<a href="https://www150.statcan.gc.ca/n1/pub/18-001-x/18-001-x2024005-fra.htm" ' +
      'target="_blank" rel="noopener">Statistique Canada</a> pour mesurer l’accès aux ' +
      'services à vélo.</p>' +
      '<p>Ensuite, le <strong>temps d’arrêt</strong>. La carte compte les feux de ' +
      'circulation, les panneaux d’arrêt et les rues que chaque trajet croise, et prévoit ' +
      'une attente à chacun. C’est pourquoi un trajet plus long sur un sentier polyvalent ' +
      'peut être plus rapide qu’un trajet plus court qui coupe à travers des rues plus ' +
      'passantes.</p>' +
      '<p>Il s’agit d’estimations. La météo, le vent, l’achalandage des sentiers et ' +
      'votre propre rythme feront varier le résultat.</p>',
    minutes: 'min',
    hours: 'h',
    pace: 'à un rythme détendu',
    langButton: 'EN',
    langButtonAria: 'Passer en anglais',
    highContrast: 'Contraste élevé',
    credits: 'Une ressource du <strong>Programme de sensibilisation à la sécurité en vélo</strong> d’<a href="https://envirocentre.ca/">Envirocentre</a>. ' +
      'Style de carte adapté de <a href="https://github.com/eljojo/bike-app-astro">whereto.bike</a> (AGPL-3.0) · ' +
      'Itinéraires par <a href="https://brouter.de">BRouter</a> · ' +
      'Données © les contributeurs d’<a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  },
};

let lang = localStorage.getItem('csap-lang')
  || (navigator.language && navigator.language.startsWith('fr') ? 'fr' : 'en');
let highContrast = localStorage.getItem('csap-hc') === 'true';
let selectedId = null;
let routesData = null;
const styles = {};

function t(key) { return I18N[lang][key]; }

/**
 * Ride time as text. Under an hour reads as plain minutes; an hour or more
 * splits into hours and minutes, because "101 min" makes a reader do the
 * arithmetic to work out whether a commute is realistic.
 */
function formatDuration(mins) {
  if (mins < 60) return `${mins} ${t('minutes')}`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m === 0
    ? `${h} ${t('hours')}`
    : `${h} ${t('hours')} ${m} ${t('minutes')}`;
}

function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  const langBtn = document.getElementById('lang-toggle');
  langBtn.textContent = t('langButton');
  langBtn.setAttribute('aria-label', t('langButtonAria'));
  renderRouteList();
  // Pill labels are formatted at render time, so they need rebuilding on a
  // language switch. Safe on the first call, before any style has loaded:
  // nothing is selected yet, so updateTimePills returns immediately. Do not
  // guard this with map.getLayer() — that throws until the style arrives, and
  // applyI18n runs before setMapStyle in boot().
  updateTimePills();
}

// ---------------------------------------------------------------------------
// Map
// ---------------------------------------------------------------------------
const map = new maplibregl.Map({
  container: 'map',
  center: [-75.72, 45.38],
  zoom: 10.4,
  attributionControl: { compact: false },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: true }));

async function loadStyle(key) {
  if (!styles[key]) {
    styles[key] = await (await fetch(`style-${key}.json`)).json();
  }
  return styles[key];
}

/**
 * Chevron used on one-way sections, drawn to a canvas rather than shipped as a
 * sprite so the page stays dependency-free. It points along +x; MapLibre's
 * `symbol-placement: line` rotates it to follow the line, so "right" means
 * "forward along the coordinate order" — which is why fetch-routes.mjs
 * reverses homeward segments.
 */
function addArrowImage() {
  if (map.hasImage('dir-arrow')) return;
  const S = 26;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const chevron = () => {
    g.beginPath();
    g.moveTo(8, 5.5); g.lineTo(18.5, 13); g.lineTo(8, 20.5);
  };
  g.lineJoin = g.lineCap = 'round';
  // White halo first so the chevron stays readable over any route colour.
  g.strokeStyle = '#ffffff'; g.lineWidth = 7.5; chevron(); g.stroke();
  g.strokeStyle = '#14294d'; g.lineWidth = 3.4; chevron(); g.stroke();
  map.addImage('dir-arrow', g.getImageData(0, 0, S, S));
}

// ---------------------------------------------------------------------------
// Casing colour
// ---------------------------------------------------------------------------
// The casing is the colour immediately adjacent to a route line, so it — not
// the base map — is what WCAG 1.4.11 measures the line's 3:1 minimum against.
// The palette is picked so eleven routes stay tellable apart, which leaves some
// colours (yellow, light blue) far too close to white: on the old fixed white
// casing, Greenboro managed 1.16:1. No single casing colour fixes that, because
// the palette runs from near-black navy to near-white yellow. So choose per
// route instead — white behind dark colours, navy behind pale ones.
//
// Derived from `color` at load time rather than baked into routes.geojson, so
// changing a route colour in fetch-routes.mjs needs no regeneration.
const CASING_DARK = '#071546'; // navy, goes behind pale route colours
const CASING_LIGHT = '#ffffff';
const MAP_EARTH = [245, 243, 239]; // style background #f5f3ef

function parseHex(hex) {
  const h = hex.replace('#', '');
  return [
    parseInt(h.slice(0, 2), 16),
    parseInt(h.slice(2, 4), 16),
    parseInt(h.slice(4, 6), 16),
    // Route colours may carry an alpha suffix, e.g. #fff200eb.
    h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1,
  ];
}

function over(fg, bg) {
  return [0, 1, 2].map(i => fg[i] * fg[3] + bg[i] * (1 - fg[3]));
}

function luminance(rgb) {
  const [r, g, b] = rgb.map(c => {
    c /= 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function contrast(a, b) {
  const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}

/** Whichever of the two casings the route line stands out against more. */
function casingFor(color) {
  const line = parseHex(color);
  return [CASING_LIGHT, CASING_DARK]
    .map(c => {
      const casing = over(parseHex(c), MAP_EARTH);
      return { c, ratio: contrast(over(line, casing), casing) };
    })
    .sort((a, b) => b.ratio - a.ratio)[0].c;
}

function overlayLayers() {
  return [
    {
      id: 'commuter-casing',
      type: 'line', source: 'commuter',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': ['get', 'casing'], 'line-width': 8, 'line-opacity': 0.85 },
    },
    {
      id: 'commuter-line',
      type: 'line', source: 'commuter',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': ['get', 'color'], 'line-width': 4.5, 'line-opacity': 0.95 },
    },
    {
      // Only sections that differ by direction carry `dir`, so this layer is
      // empty for every route that is ridden the same way both ways.
      id: 'commuter-arrows',
      type: 'symbol', source: 'commuter',
      filter: arrowFilter(),
      // Below this the one-way pair is too small to read as two lines.
      minzoom: 12,
      layout: {
        'symbol-placement': 'line',
        'symbol-spacing': 68,
        'icon-image': 'dir-arrow',
        'icon-size': 0.85,
        'icon-allow-overlap': true,
        'icon-ignore-placement': true,
        'icon-rotation-alignment': 'map',
        'icon-pitch-alignment': 'map',
      },
      paint: { 'icon-opacity': 1 },
    },
  ];
}

/**
 * Add (or re-add) the overlay. Every step is guarded individually rather than
 * returning early on the source, because a setStyle diff can keep the source
 * and layers while still clearing the image registry — bailing out on the
 * source alone left the arrow layer pointing at a missing image.
 */
function addOverlay() {
  if (!routesData) return;
  addArrowImage(); // must exist before the symbol layer references it
  if (!map.getSource('commuter')) {
    map.addSource('commuter', { type: 'geojson', data: routesData });
  }
  overlayLayers().forEach(l => { if (!map.getLayer(l.id)) map.addLayer(l); });
  applySelection();
}

/** True when this route has sections that differ by direction of travel. */
function hasDirections(id) {
  return !!id && !!routesData
    && routesData.features.some(f => f.properties.id === id && f.properties.dir);
}

/**
 * Which one-way sections show arrows.
 *
 * With no route selected, every corridor is drawn at full strength, so arrows on
 * a one-way section that runs underneath another route read as belonging to that
 * route — Findlay Creek / South Keys under Greenboro on O'Connor St, for
 * instance. `tools/fetch-routes.mjs` marks the runs no other route shadows with
 * `solo`, and only those show arrows here.
 *
 * Selecting a route dims the others to 0.12, so the ambiguity is gone and the
 * full set of arrows is more useful than a partial one.
 */
function arrowFilter() {
  return selectedId
    ? ['has', 'dir']
    : ['all', ['has', 'dir'], ['has', 'solo']];
}

function applySelection() {
  if (!map.getLayer('commuter-line')) return;
  // Selected route: thickness encodes protection from car traffic.
  const safetyWidth = ['match', ['get', 'safety'], 'carfree', 6, 'lane', 3, 2];
  const safetyCasing = ['match', ['get', 'safety'], 'carfree', 9, 'lane', 6, 5];
  const dim = selectedId
    ? ['case', ['==', ['get', 'id'], selectedId], 0.95, 0.12]
    : 0.95;
  const dimCasing = selectedId
    ? ['case', ['==', ['get', 'id'], selectedId], 0.85, 0.06]
    : 0.85;
  const width = selectedId
    ? ['case', ['==', ['get', 'id'], selectedId], safetyWidth, 3]
    : 4.5;
  const casingWidth = selectedId
    ? ['case', ['==', ['get', 'id'], selectedId], safetyCasing, 6]
    : 8;
  map.setPaintProperty('commuter-line', 'line-opacity', dim);
  map.setPaintProperty('commuter-line', 'line-width', width);
  map.setPaintProperty('commuter-casing', 'line-opacity', dimCasing);
  map.setPaintProperty('commuter-casing', 'line-width', casingWidth);
  // Arrows fade with their route, so a dimmed route's arrows do not read as
  // belonging to the selected one.
  map.setPaintProperty('commuter-arrows', 'icon-opacity', selectedId
    ? ['case', ['==', ['get', 'id'], selectedId], 1, 0.15]
    : 1);
  map.setFilter('commuter-arrows', arrowFilter());
  document.querySelectorAll('.route').forEach(el => {
    const on = el.dataset.id === selectedId;
    el.classList.toggle('active', on);
    el.setAttribute('aria-expanded', String(on));
    const detail = document.getElementById('detail-' + el.dataset.id);
    if (detail) detail.hidden = !on;
  });
  document.getElementById('showall').classList.toggle('visible', !!selectedId);
  document.getElementById('safety-note').classList.toggle('visible', !!selectedId);
  document.getElementById('oneway-note').classList.toggle('visible', hasDirections(selectedId));
  updatePhotoBubbles();
  updateTimePills();
}

// Photo bubbles — small round thumbnails showing what the infrastructure
// looks like at that spot; visible only while their route is selected.
//
// Turned OFF at the client's request for now. The feature is complete and
// tested — set SHOW_PHOTOS to true to bring it back (photos live in photos/
// and are listed in photos.json).
const SHOW_PHOTOS = false;

let photosData = [];
let photoMarkers = [];
let pillsData = [];

function updatePhotoBubbles() {
  photoMarkers.forEach(m => m.remove());
  photoMarkers = [];
  if (!SHOW_PHOTOS) return;
  if (!selectedId) return;
  for (const ph of photosData.filter(p => p.route === selectedId)) {
    const el = document.createElement('button');
    el.className = 'photo-bubble';
    el.style.backgroundImage = `url("${ph.src}")`;
    el.setAttribute('aria-label', ph['caption_' + lang] || 'Photo');
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      new maplibregl.Popup({ closeButton: true, maxWidth: '300px' })
        .setLngLat([ph.lon, ph.lat])
        .setHTML(
          `<img class="photo-popup-img" src="${ph.src}" alt="">` +
          `<div class="photo-popup-caption">${ph['caption_' + lang] || ''}</div>`)
        .addTo(map);
    });
    photoMarkers.push(
      new maplibregl.Marker({ element: el }).setLngLat([ph.lon, ph.lat]).addTo(map));
  }
}

// Time-remaining pills — "35 min" markers along the selected route, counting
// down to downtown. Only the selected route shows them; eleven routes' worth at
// once would be unreadable.
let pillMarkers = [];

function updateTimePills() {
  pillMarkers.forEach(m => m.remove());
  pillMarkers = [];
  if (!selectedId || !pillsData.length) return;
  for (const pill of pillsData.filter(p => p.route === selectedId)) {
    const el = document.createElement('div');
    el.className = 'time-pill';
    el.textContent = formatDuration(pill.minutes);
    el.setAttribute('aria-label', t('pillAria').replace('{t}', formatDuration(pill.minutes)));
    pillMarkers.push(
      new maplibregl.Marker({ element: el }).setLngLat([pill.lon, pill.lat]).addTo(map));
  }
}

function boundsForId(id) {
  const b = new maplibregl.LngLatBounds();
  routesData.features
    .filter(f => f.properties.id === id)
    .forEach(f => f.geometry.coordinates.forEach(c => b.extend(c)));
  return b;
}

function allBounds() {
  const b = new maplibregl.LngLatBounds();
  routesData.features.forEach(f => f.geometry.coordinates.forEach(c => b.extend(c)));
  return b;
}

function selectRoute(id) {
  selectedId = (selectedId === id) ? null : id;
  applySelection();
  if (selectedId) {
    map.fitBounds(boundsForId(selectedId), { padding: 70, duration: 800 });
  } else {
    map.fitBounds(allBounds(), { padding: 60, duration: 800 });
  }
}

function renderRouteList() {
  if (!routesData) return;
  const list = document.getElementById('route-list');
  list.innerHTML = '';
  // Routes span multiple safety stretches — one list entry each, A→Z by the
  // name shown in the current language (localeCompare handles accents).
  const seen = new Set();
  const routes = [];
  for (const f of routesData.features) {
    if (seen.has(f.properties.id)) continue;
    seen.add(f.properties.id);
    routes.push(f.properties);
  }
  routes.sort((a, b) =>
    a['name_' + lang].localeCompare(b['name_' + lang], lang, { sensitivity: 'base' }));

  for (const p of routes) {
    const item = document.createElement('div');
    item.className = 'route-item';

    const btn = document.createElement('button');
    btn.className = 'route' + (p.id === selectedId ? ' active' : '');
    btn.dataset.id = p.id;
    btn.setAttribute('aria-controls', 'detail-' + p.id);
    btn.setAttribute('aria-expanded', String(p.id === selectedId));
    btn.innerHTML =
      `<span class="chip" style="background:${p.color}"></span>` +
      `<span><strong>${p['name_' + lang]}</strong><br>` +
      `<span class="meta">${p.distance_km} km · ~${formatDuration(p.minutes)} · ${p.carfree_pct} % ${t('carFree')}</span></span>`;
    btn.addEventListener('click', () => selectRoute(p.id));

    // The description and the two conditional notes used to exist only inside a
    // popup opened by clicking the map, which no keyboard user could reach.
    // They live here instead: built for every route, revealed with `hidden`
    // when its route is selected. Toggling beats re-rendering — rebuilding the
    // list would drop keyboard focus back to <body> mid-use.
    const detail = document.createElement('div');
    detail.className = 'route-detail';
    detail.id = 'detail-' + p.id;
    detail.hidden = p.id !== selectedId;
    // Distance, time and car-free share are already on the button above, so the
    // detail carries only what the button cannot. Both facts are optional — at
    // present a single route differs by direction on the ride home.
    const facts = [];
    if (p.distance_km_home || p.minutes_home) {
      facts.push(`${t('homeDistance')} ${p.distance_km_home || p.distance_km} km`
        + ` (~${formatDuration(p.minutes_home || p.minutes)})`);
    }
    if (p.stop_minutes) facts.push(t('stopNote').replace('{m}', p.stop_minutes));
    detail.innerHTML =
      `<p class="route-desc">${p['desc_' + lang]}</p>` +
      (facts.length
        ? `<ul class="route-facts">${facts.map(f => `<li>${f}</li>`).join('')}</ul>`
        : '') +
      `<button type="button" class="how-times-cue" data-how-times>${t('howTimesLink')}</button>`;

    item.append(btn, detail);
    list.appendChild(item);
  }
}

// Click a route line: select it (like the side panel). Click the
// already-selected route again for the section details popup.
map.on('click', (e) => {
  if (!map.getLayer('commuter-line')) return;
  const hits = map.queryRenderedFeatures(e.point, { layers: ['commuter-line'] });
  if (!hits.length) return;
  const p = hits[0].properties;
  if (p.id !== selectedId) {
    selectRoute(p.id);
    return;
  }
  const dirLabel = { towork: t('dirTowork'), home: t('dirHome') }[p.dir];
  // One bullet per fact. Distance, time and car-free share always apply; the
  // other two exist only on routes that differ by direction, or that stop at all.
  // Note the non-breaking space before the % below, so the figure cannot wrap.
  const stats = [
    `${p.distance_km} km`,
    `~${formatDuration(p.minutes)} ${t('pace')}`,
    `${p.carfree_pct} % ${t('carFree')}`,
  ];
  if (p.distance_km_home || p.minutes_home) {
    stats.push(`${t('homeDistance')} ${p.distance_km_home || p.distance_km} km`
      + ` (~${formatDuration(p.minutes_home || p.minutes)})`);
  }
  // The junction count stays out of the copy on purpose: it is an over-count by
  // construction (see "Ride time estimates" in README.md), so printing a precise
  // figure invites a reader to check it and find it wrong.
  if (p.stop_minutes) stats.push(t('stopNote').replace('{m}', p.stop_minutes));
  // closeButton so the popup can be dismissed deliberately rather than only by
  // clicking somewhere else on the map.
  new maplibregl.Popup({ closeButton: true, maxWidth: '270px' })
    .setLngLat(e.lngLat)
    .setHTML(
      `<strong>${p['name_' + lang]}</strong>` +
      `<div class="pop-desc">${p['desc_' + lang]}</div>` +
      (dirLabel ? `<div class="pop-desc"><strong>${dirLabel}</strong></div>` : '') +
      `<ul class="pop-stats">${stats.map(s => `<li>${s}</li>`).join('')}</ul>` +
      `<button type="button" class="how-times-cue" data-how-times>${t('howTimesLink')}</button>`)
    .addTo(map);
});
map.on('mousemove', (e) => {
  const hits = map.queryRenderedFeatures(e.point, { layers: map.getLayer('commuter-line') ? ['commuter-line'] : [] });
  map.getCanvas().style.cursor = hits.length ? 'pointer' : '';
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
async function setMapStyle() {
  const style = await loadStyle(highContrast ? 'high-contrast' : 'default');
  map.setStyle(style);
}

// Overlay is (re)added on every style.load — initial load and HC switches.
map.on('style.load', addOverlay);
// Backstop for the same race: if the arrow is ever asked for before it is
// registered, register it on demand rather than drawing nothing.
map.on('styleimagemissing', (e) => { if (e.id === 'dir-arrow') addArrowImage(); });
window._map = map; // debugging hook

(async function boot() {
  applyI18n();
  routesData = await fetch('routes.geojson').then(r => r.json());
  // See casingFor(): the casing colour is per route, not fixed white.
  for (const f of routesData.features) f.properties.casing = casingFor(f.properties.color);
  photosData = SHOW_PHOTOS
    ? await fetch('photos.json').then(r => r.ok ? r.json() : []).catch(() => [])
    : [];
  // Optional: a route without pills simply shows none.
  pillsData = await fetch('time-pills.json').then(r => r.ok ? r.json() : []).catch(() => []);
  renderRouteList();
  await setMapStyle();
  map.fitBounds(allBounds(), { padding: 60, duration: 0 });
})();

document.getElementById('lang-toggle').addEventListener('click', () => {
  lang = lang === 'en' ? 'fr' : 'en';
  localStorage.setItem('csap-lang', lang);
  applyI18n();
});

const hcBtn = document.getElementById('hc-toggle');
hcBtn.setAttribute('aria-pressed', String(highContrast));
hcBtn.addEventListener('click', async () => {
  highContrast = !highContrast;
  localStorage.setItem('csap-hc', String(highContrast));
  hcBtn.setAttribute('aria-pressed', String(highContrast));
  await setMapStyle();
});

document.getElementById('showall').addEventListener('click', () => selectRoute(selectedId));

const panelToggle = document.getElementById('panel-toggle');

// Below 700px the panel is a closed disclosure (display:none), so the skip
// link has to open it before focusing — otherwise the target is not rendered
// and focus goes nowhere. Handled here rather than left to the href so the
// open-then-focus order is deterministic.
document.querySelector('.skip-link').addEventListener('click', (e) => {
  e.preventDefault();
  const panel = document.getElementById('panel');
  if (getComputedStyle(panel).display === 'none') {
    panel.classList.add('open');
    panelToggle.setAttribute('aria-expanded', 'true');
  }
  document.getElementById('route-list').focus();
});

panelToggle.addEventListener('click', () => {
  // The panel is a narrow-screen disclosure, so its open state has to be
  // announced, not just styled.
  const open = document.getElementById('panel').classList.toggle('open');
  panelToggle.setAttribute('aria-expanded', String(open));
});

// "How ride times are estimated". One dialog, two ways in: the footer link and a
// cue in the section popup. Delegated from the document because the popup cue is
// created on the fly and the footer link is re-rendered on every language switch,
// so neither element survives long enough to hold its own listener.
const howTimes = document.getElementById('how-times');
document.addEventListener('click', (e) => {
  if (e.target.closest('#how-times .dlg-close')) {
    howTimes.close();
  } else if (e.target.closest('[data-how-times]')) {
    e.preventDefault();
    if (!howTimes.open) howTimes.showModal(); // showModal() throws if already open
  }
});
</script>
</body>
</html>
